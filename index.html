/* =====================================

===================================== */

const SUPABASE_URL =
    "https://zewmfdbtztjobxwugxxp.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_BTFTDuwS6H06gMjp_uF6Yw_8Kgg-gC9";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================
   ELEMENTOS
===================================== */

const contadorElemento =
    document.getElementById("contador");

const botao =
    document.getElementById("siiiButton");

const status =
    document.getElementById("status");


/* =====================================
   VERIFICAR SE JÁ VOTOU
===================================== */

let jaVotou =
    localStorage.getItem("jaDeuSiii") === "true";


function atualizarBotao() {

    if (jaVotou) {

        botao.textContent =
            "✅ Você já deu SIII!";

        botao.disabled = true;

        botao.style.opacity = "0.6";

    }

}


/* =====================================
   PEGAR CONTADOR DO SUPABASE
===================================== */

async function carregarContador() {

    const { data, error } =
        await supabaseClient
        .from("siii")
        .select("total")
        .eq("id", 1)
        .single();


    if (error) {

        console.error(error);

        status.textContent =
            "Erro ao carregar o contador.";

        return;
    }


    contadorElemento.textContent =
        data.total;

}


/* =====================================
   DAR SIII
===================================== */

async function darSiii() {

    if (jaVotou) {
        return;
    }


    botao.disabled = true;

    status.textContent =
        "Enviando seu SIII... 🔥";


    const { error } =
        await supabaseClient.rpc(
            "incrementar_siii"
        );


    if (error) {

        console.error(error);

        status.textContent =
            "Não foi possível registrar seu SIII.";

        botao.disabled = false;

        return;
    }


    localStorage.setItem(
        "jaDeuSiii",
        "true"
    );

    jaVotou = true;


    status.textContent =
        "SIII! 🔥 Você faz parte da comunidade!";


    atualizarBotao();

    carregarContador();

}
